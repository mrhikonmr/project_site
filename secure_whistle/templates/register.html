{% extends 'base.html' %}{% block title %}Регистрация · SecureWhistle{% endblock %}{% block header %}{% endblock %}
{% block c %}<section class="auth">{% include '_auth_side.html' %}<div class="auth-form"><h2>Регистрация</h2><form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Логин<input type="text" name="username" minlength="3" maxlength="32" required autocomplete="username"><span class="hint">Придумайте псевдоним. Настоящее имя указывать не нужно.</span></label>
<label>Пароль<input type="password" name="password" minlength="10" required autocomplete="new-password"><span class="hint">От 10 символов, буквы и цифры.</span></label>
<button class="btn">Создать аккаунт</button></form><p class="alt">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p></div></section>{% endblock %}
